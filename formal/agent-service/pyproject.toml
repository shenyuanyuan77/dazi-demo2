[project]
name = "fitness-agent-service"
version = "0.1.0"
description = "LangGraph-based fitness coach agent service for the 搭子 fitness miniprogram. Replaces the Node rule-based harness with a graph-orchestrated agent + RAGFlow knowledge retrieval, while keeping the pendingWrite confirmation protocol unchanged."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "搭子 fitness team" }]

dependencies = [
    # --- Web framework ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",

    # --- Agent orchestration ---
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",   # works with MiMo's OpenAI-compatible API

    # --- Retrieval (RAGFlow HTTP client; no heavy SDK needed) ---
    "httpx>=0.27",

    # --- Observability ---
    "structlog>=24.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",          # httpx mock for RAGFlow / MiMo tests
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
fitness-agent = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]   # line length enforced by formatter instead

# --- Pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# --- mypy ---
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
